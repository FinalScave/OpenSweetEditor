plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publisher)
}
apply plugin: "signing"

description = "Cross-platform code editor"
group = "com.qiplat"
version = "1.0.0-rc1"

android {
    namespace 'com.qiplat.sweeteditor'
    compileSdk 34
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 21
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                arguments "-DANDROID=ON"
                arguments "-DSWEETEDITOR_BUILD_SHARED=ON"
                arguments "-DSWEETEDITOR_BUILD_STATIC=OFF"
                arguments "-DSWEETEDITOR_BUILD_TESTS=OFF"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release",
                              "-DCMAKE_C_FLAGS_RELEASE=-Os -DNDEBUG -s",
                              "-DCMAKE_CXX_FLAGS_RELEASE=-Os -DNDEBUG -s"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path "../../../CMakeLists.txt"
        }
    }
}

dependencies {
    implementation libs.gson
    implementation libs.annotation
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

javadoc {
    failOnError false
    options {
        locale("zh_CN")
        encoding("utf-8")
        links("http://docs.oracle.com/javase/7/docs/api")
    }
}

def mavenCentralUsername = providers.gradleProperty("mavenCentralUsername")
def mavenCentralPassword = providers.gradleProperty("mavenCentralPassword")

signing {
    useGpgCmd()
}

centralPortal {
    username = mavenCentralUsername.orNull
    password = mavenCentralPassword.orNull
    name = "sweeteditor"

    pom {
        url = "https://github.com/FinalScave/SweetEditor"
        licenses {
            license {
                name = "MIT"
                url = "https://opensource.org/licenses/MIT"
            }
        }
        developers {
            developer {
                name = "Scave"
                email = "iscave@163.com"
                organization = "Mobile IPE"
                organizationUrl = "https://github.com/mobile-ipe"
            }
        }
        scm {
            connection = "scm:git:https://github.com/FinalScave/SweetEditor.git"
            developerConnection = "scm:git:https://github.com/FinalScave/SweetEditor"
            url = "https://github.com/FinalScave/SweetEditor"
        }
    }
}
