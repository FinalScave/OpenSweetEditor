plugins {
    alias(libs.plugins.android.application)
}

evaluationDependsOn(':sweeteditor')

android {
    namespace 'com.qiplat.sweeteditor.demo'
    compileSdk 34

    def traceGitSha = providers.exec {
        commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
    }.standardOutput.asText.get().trim()
    def traceGitBranch = providers.exec {
        commandLine 'git', 'rev-parse', '--abbrev-ref', 'HEAD'
    }.standardOutput.asText.get().trim()
    def traceBuildTime = new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")

    defaultConfig {
        applicationId "com.qiplat.sweeteditor.demo"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GIT_SHA", "\"${traceGitSha}\""
        buildConfigField "String", "GIT_BRANCH", "\"${traceGitBranch}\""
        buildConfigField "String", "BUILD_TIME", "\"${traceBuildTime}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    configurations {
        cleanedAnnotations
        implementation.exclude group: 'org.jetbrains', module: 'annotations'
        implementation.exclude group: 'com.intellij', module: 'annotations'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }


    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "SweetEditor for Android-${rootProject.project(':sweeteditor').version}.APK"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../_res']
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(":sweeteditor")
    implementation 'com.qiplat:sweetline:1.1.1'
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
